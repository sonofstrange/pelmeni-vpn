plugins { id 'com.android.application' }

android {
    namespace 'com.example.sshtunnel.devcontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.sshtunnel.devcontrol'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
