plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv('PELMENI_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('PELMENI_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('PELMENI_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('PELMENI_RELEASE_KEY_PASSWORD')
def releaseSigningReady = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.isBlank() }

android {
    namespace 'com.example.sshtunnel'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.example.sshtunnel'
        minSdk 26
        targetSdk 35
        versionCode 70
        versionName '1.35'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /(?i)^(assembleRelease|bundleRelease|packageRelease|signRelease.*)$/) {
        task.doFirst {
            if (!releaseSigningReady) {
                throw new GradleException(
                        'Release signing is not configured. Set PELMENI_RELEASE_KEYSTORE, '
                                + 'PELMENI_RELEASE_STORE_PASSWORD, PELMENI_RELEASE_KEY_ALIAS '
                                + 'and PELMENI_RELEASE_KEY_PASSWORD.')
            }
        }
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:0.2.21'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
