plugins { id 'com.android.application' }

def defaultKeystore = new File(System.getProperty('user.home'), '.android/debug.keystore')
def releaseKeystorePath = System.getenv('PELMENI_RELEASE_KEYSTORE') ?: (defaultKeystore.exists() ? defaultKeystore.absolutePath : null)
def releaseStorePassword = System.getenv('PELMENI_RELEASE_STORE_PASSWORD') ?: 'android'
def releaseKeyAlias = System.getenv('PELMENI_RELEASE_KEY_ALIAS') ?: 'androiddebugkey'
def releaseKeyPassword = System.getenv('PELMENI_RELEASE_KEY_PASSWORD') ?: 'android'
def releaseSigningReady = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.isBlank() }

android {
    namespace 'com.example.sshtunnel.devcontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.sshtunnel.devcontrol'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.36-beta.1'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /(?i)^(assembleRelease|bundleRelease|packageRelease|signRelease.*)$/) {
        task.doFirst {
            if (!releaseSigningReady) {
                throw new GradleException(
                        'Release signing is not configured. Set PELMENI_RELEASE_KEYSTORE, '
                                + 'PELMENI_RELEASE_STORE_PASSWORD, PELMENI_RELEASE_KEY_ALIAS '
                                + 'and PELMENI_RELEASE_KEY_PASSWORD.')
            }
        }
    }
}
